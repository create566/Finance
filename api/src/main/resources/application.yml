server:
  port: 8990

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/www_finance?serverTimezone=GMT%2B8&characterEncoding=utf-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: true
        register-enabled: true
    sentinel:
      enabled: false
  autoconfigure:
    exclude:
      - com.alibaba.cloud.sentinel.custom.SentinelAutoConfiguration
      - com.alibaba.cloud.sentinel.SentinelWebAutoConfiguration
      - com.alibaba.cloud.sentinel.endpoint.SentinelEndpointAutoConfiguration

# Feign Sentinel：本地开发直连模式(url)下需关闭，否则 Sentinel 包装会导致所有请求走 fallback
# 生产环境走 Nacos 负载均衡时可改为 true
feign:
  sentinel:
    enabled: false

# 本地开发：service-sms 直连 finance-message（无需 Nacos）
service-sms:
  ribbon:
    listOfServers: localhost:8120

# 安全配置
security:
  jwt:
    secret: ${JWT_SECRET:vsofo-5grcs-secret-change-me}
    expiration: 604800
  bank:
    sign-key: ${BANK_SIGN_KEY:change-bank-sign-key-in-prod}
    agent-id: ${BANK_AGENT_ID:999888}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.demo.entity
  configuration:
    map-underscore-to-camel-case: true

devtools:
  restart:
    enabled: false
    additional-paths: src/main/java
    exclude: WEB-INF/**