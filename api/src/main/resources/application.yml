server:
  port: 8990

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ww_finance?serverTimezone=GMT%2B8&characterEncoding=utf-8
    username: ${DB_USERNAME:ww_finance}
    password: ${DB_PASSWORD:ww_finance_2024}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: false
        register-enabled: false
      sentinel:
        enabled: false
  autoconfigure:
    exclude:
      - com.alibaba.cloud.sentinel.SentinelAutoConfiguration

# 安全配置
security:
  jwt:
    secret: ${JWT_SECRET:vsofo-5grcs-secret-change-me}
    expiration: 604800
  bank:
    sign-key: ${BANK_SIGN_KEY:change-bank-sign-key-in-prod}
    agent-id: ${BANK_AGENT_ID:999888}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.demo.entity
  configuration:
    map-underscore-to-camel-case: true

devtools:
  restart:
    enabled: false
    additional-paths: src/main/java
    exclude: WEB-INF/**
