server:
  port: 8990

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ww_finance?serverTimezone=GMT%2B8&characterEncoding=utf-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: false
        register-enabled: false
    sentinel:
      enabled: false
  autoconfigure:
    exclude:
      - com.alibaba.cloud.sentinel.custom.SentinelAutoConfiguration
      - com.alibaba.cloud.sentinel.SentinelWebAutoConfiguration
      - com.alibaba.cloud.sentinel.endpoint.SentinelEndpointAutoConfiguration

# Feign Sentinel：本地开发直连模式(url)下需关闭，否则 Sentinel 包装会导致所有请求走 fallback
# 生产环境走 Nacos 负载均衡时可改为 true
feign:
  sentinel:
    enabled: false

# 本地开发：service-sms 直连 finance-message（无需 Nacos）
service-sms:
  ribbon:
    listOfServers: localhost:8120

# 安全配置
security:
  jwt:
    # 生产务必用环境变量 JWT_SECRET 覆盖。
    # 默认值必须与 TokenUtil 的历史硬编码值一致，改错会让所有已登录用户掉线（验签失败）。
    secret: ${JWT_SECRET:vsofo-5grcs-secret}
    expiration: 604800
  # ⚠ 注意：签名相关配置不在此处生效，别改这里。
  # HfbConst.SIGN_KEY 与 finance-common 的 BankSignUtil.SIGN_KEY 都是直接读环境变量
  # BANK_SIGN_KEY（默认 9876543210，必须与银行端 SignUtil.SIGN_KEY 一致，否则回调全部验签失败）。
  # 同理 agentId 读环境变量 BANK_AGENT_ID（默认 999888）。
  # 两边必须同值：改一处不生效，改错则验签不通。

# 文件存储配置（可动态切换存储策略）
file:
  storage:
    # 存储策略：local=本地存储, aliyun=阿里云OSS, tencent=腾讯云COS, minio=MinIO
    strategy: ${FILE_STORAGE_STRATEGY:local}

    # 本地存储配置
    local:
      base-path: ${FILE_LOCAL_PATH:D:/桌面/实训/demo/uploads}
      url-prefix: ${FILE_LOCAL_URL_PREFIX:/api/knowledge/files}

    # 阿里云OSS配置（未来扩展用，当前不启用）
    # aliyun:
    #   endpoint: oss-cn-hangzhou.aliyuncs.com
    #   access-key-id: your-access-key-id
    #   access-key-secret: your-access-key-secret
    #   bucket-name: your-bucket-name

# AI服务配置
ai:
  embedding:
    service-url: ${AI_EMBEDDING_URL:http://localhost:8081/ai/knowledge/embedding}

# 定时任务分布式锁（2026-10-06 新增）
# 多实例部署时必须为 true：Spring Task 会在每个实例各跑一遍，
# 其中「超期未签确认书自动退资」是动钱动作，重复执行 = 重复退资。
# 本地单实例开发可置 false 关闭（跳过抢锁，行为与改造前一致）。
job:
  distributed-lock:
    enabled: ${JOB_DISTRIBUTED_LOCK_ENABLED:true}

# 银行对接地址（2026-10-06 新增，原为 HfbConst 中的 localhost 硬编码）
# ⚠ 部署到非本机环境必须显式覆盖这三项，否则所有动钱接口会指向自己、银行回调也永远收不到。
bank:
  # 银行网关地址：我方提交充值/提现/投标/放款/还款表单的目标地址
  base-url: ${BANK_BASE_URL:http://localhost:9090}
  # 我方接收银行异步回调的地址：会随表单提交给银行，必须是银行能访问到的地址
  notify-base-url: ${BANK_NOTIFY_BASE_URL:http://localhost:8990}
  # 银行处理完成后跳回的前端页面地址
  front-base-url: ${BANK_FRONT_BASE_URL:http://localhost:5174}

# 银行库（旺旺银行）。生产环境必须用环境变量注入，禁止把真实凭据提交到仓库。
# 默认值仅为保证本地开发开箱即跑；⚠ 若本文件曾推送到远端，请立即在阿里云侧轮换该密码。
bank-datasource:
  url: ${BANK_DB_URL:jdbc:mysql://rm-uf6ry261ghx3995253o.mysql.rds.aliyuncs.com:3306/ww_bank?serverTimezone=GMT%2B8&characterEncoding=utf-8}
  username: ${BANK_DB_USERNAME:shangqiuedu}
  password: ${BANK_DB_PASSWORD:shangqiuedu_kakdadajeLo90}
  driver-class-name: com.mysql.cj.jdbc.Driver
  # 银行库取不到时降级到平台 user_account，详见 BankDataSourceConfig
  connect-timeout-ms: ${BANK_DB_CONNECT_TIMEOUT:8000}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.demo.entity
  configuration:
    map-underscore-to-camel-case: true