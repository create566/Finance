server:
  port: 8990

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ww_finance?serverTimezone=GMT%2B8&characterEncoding=utf-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        enabled: false
        register-enabled: false
    sentinel:
      enabled: false
  autoconfigure:
    exclude:
      - com.alibaba.cloud.sentinel.custom.SentinelAutoConfiguration
      - com.alibaba.cloud.sentinel.SentinelWebAutoConfiguration
      - com.alibaba.cloud.sentinel.endpoint.SentinelEndpointAutoConfiguration

# Feign Sentinel：本地开发直连模式(url)下需关闭，否则 Sentinel 包装会导致所有请求走 fallback
# 生产环境走 Nacos 负载均衡时可改为 true
feign:
  sentinel:
    enabled: false

# 本地开发：service-sms 直连 finance-message（无需 Nacos）
service-sms:
  ribbon:
    listOfServers: localhost:8120

# 安全配置
security:
  jwt:
    secret: ${JWT_SECRET:vsofo-5grcs-secret-change-me}
    expiration: 604800
  bank:
    sign-key: ${BANK_SIGN_KEY:change-bank-sign-key-in-prod}
    agent-id: ${BANK_AGENT_ID:999888}

# 文件存储配置（可动态切换存储策略）
file:
  storage:
    # 存储策略：local=本地存储, aliyun=阿里云OSS, tencent=腾讯云COS, minio=MinIO
    strategy: ${FILE_STORAGE_STRATEGY:local}

    # 本地存储配置
    local:
      base-path: ${FILE_LOCAL_PATH:D:/桌面/实训/demo/uploads}
      url-prefix: ${FILE_LOCAL_URL_PREFIX:/api/knowledge/files}

    # 阿里云OSS配置（未来扩展用，当前不启用）
    # aliyun:
    #   endpoint: oss-cn-hangzhou.aliyuncs.com
    #   access-key-id: your-access-key-id
    #   access-key-secret: your-access-key-secret
    #   bucket-name: your-bucket-name

# AI服务配置
ai:
  embedding:
    service-url: ${AI_EMBEDDING_URL:http://localhost:8081/ai/knowledge/embedding}

