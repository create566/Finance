# 实训项目本地基础服务：ChromaDB（向量库） + Redis（缓存）
# 用法：在本文件所在目录执行
#   docker compose up -d     启动（后台）
#   docker compose ps        查看状态
#   docker compose logs -f chroma   跟日志
#   docker compose stop/start/down  停止/启动/删除

services:
  chroma:
    # 版本说明（重要）：Spring AI 1.1.2 的 ChromaApi 走的是 /api/v2/*，
    # 必须用 Chroma 1.x；0.6.x 只提供 v1，会导致检索失败。
    # 镜像源用 GHCR：Docker Hub 的 chromadb/chroma 部分 tag 拉取会报
    # "descriptor is neither a manifest or index"。
    image: ghcr.io/chroma-core/chroma:1.0.0
    container_name: ww_chroma
    ports:
      - "8000:8000"
    volumes:
      # Chroma 1.0.0 实际持久化目录是 /data（容器日志输出 "Saving data to: /data"，
      # 数据库文件为 /data/chroma.sqlite3）。旧配置挂载到 /chroma/chroma 是错误路径，
      # 导致向量数据落在容器可写层，容器重建即丢失。
      - chroma_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ww_redis
    # 注意：本机 6379 目前空闲（无进程监听），改回默认 6379 以匹配主项目
    #（Spring Boot 端口 8990，com.example.demo）JWT 拦截器的 localhost:6379 Redis 连接。
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

# ---------------------------------------------------------------------------
# 注意：本项目的 Nacos 注册中心**不在本 compose 内**，而是宿主机上的独立安装：
#   安装目录  D:\nacos\nacos-dist\nacos      （2.2.3，由 D:\nacos\nacos-src-2.2.3.zip 源码构建）
#   启动脚本  D:\nacos\nacos-dist\nacos\start-standalone.bat
#   监听端口  8848（HTTP API + 控制台 /nacos）、9848 / 9849（Nacos 2.x gRPC）
#   关键配置  conf\application.properties → server.port=8848、nacos.core.auth.enabled=false
# 因鉴权是关闭的，工程 yml 里**不再写** nacos 账号密码 —— 实测写了反而有害：
# auth 关闭时 /nacos/v1/auth/users/login 恒失败（默认口令 500、自定义口令 403 user not found），
# 客户端会每 2 秒重试并刷 SecurityProxy ERROR 日志。详见 api/application.yml 同处注释。
# 2026-10-08 实测：该实例已在运行，v1 OpenAPI 正常；工程客户端是 nacos-client 1.4.x
# （走 v1 HTTP 注册与心跳），而 Nacos 2.x 服务端完整保留 v1 OpenAPI，可直接注册成功。
# 之所以不把 Nacos 塞进 compose：8848 已被上述宿主机实例占用，容器再起会端口冲突。
# ---------------------------------------------------------------------------
volumes:
  chroma_data:
  redis_data:
