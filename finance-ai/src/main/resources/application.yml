server:
  port: 8081 # AI服务端口

spring:
  ai:
    # MaaS 平台 OpenAI 兼容模式（qwen3.8-max 走 /compatible-mode 端点）
    openai:
      base-url: https://maas.qianwenaiapi.com
      # 直接写死的 MaaS 平台 key（不读取系统环境变量，避免环境变量覆盖导致排查困难）
      api-key: sk-ws-H.PLMEYEH.oPjQ.MEYCIQCCdaRzX7ouq3QBMgyJJD99r393HUImT16W_Q4U0FsUjgIhANcFXE8GyVKeVJhdnjXXUAdZEHjWnCZQ-es4mGNeF1Zx
      chat:
        completions-path: /compatible-mode/v1/chat/completions
        options:
          model: qwen3.8-max
          temperature: 0.7
      embedding:
        embeddings-path: /compatible-mode/v1/embeddings
        options:
          model: qwen3.7-text-embedding-flash
      # 关闭重试,避免超时被放大 3 倍
      retry:
        max-attempts: 1
    chroma:
      client:
        host: ${CHROMADB_HOST:127.0.0.1}
        port: ${CHROMADB_PORT:8000}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ww_finance?serverTimezone=GMT%2B8&characterEncoding=utf-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  # 跨域配置已迁移到 com.kzip.app.config.CorsConfig（Java 配置类）
  # 之前的 spring.mvc.cors.mappings 已删除，避免与 Java 配置重复/覆盖

# ChromaDB连接配置（本地环境）
chromadb:
  host: ${CHROMADB_HOST:127.0.0.1}
  port: ${CHROMADB_PORT:8000}
  auto-start: ${CHROMADB_AUTO_START:false}  # 是否自动启动ChromaDB（需要Python环境）

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.kzip.app.entity
  configuration:
    map-underscore-to-camel-case: true