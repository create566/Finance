server:
  port: 8081 # AI服务端口

spring:
  # MongoDB 会话历史存储（本地已装 MongoDB）
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ww_finance_ai}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  ai:
    # MaaS 平台 OpenAI 兼容模式（qwen3.8-max 走 /compatible-mode 端点）
    openai:
      base-url: ${MAAS_BASE_URL:https://maas.qianwenaiapi.com}
      # 密钥优先从环境变量 MAAS_API_KEY 注入；下方默认值仅为本地开发过渡用。
      # 注意：该 key 历史上曾明文提交进代码库，视为已泄露，请尽快到 MaaS 平台轮换，
      # 轮换后设置系统环境变量 MAAS_API_KEY 并删除此默认值
      api-key: ${MAAS_API_KEY:sk-ws-H.PLMEYEH.oPjQ.MEYCIQCCdaRzX7ouq3QBMgyJJD99r393HUImT16W_Q4U0FsUjgIhANcFXE8GyVKeVJhdnjXXUAdZEHjWnCZQ-es4mGNeF1Zx}
      chat:
        completions-path: /compatible-mode/v1/chat/completions
        options:
          model: qwen3.8-max
          temperature: 0.7
      embedding:
        embeddings-path: /compatible-mode/v1/embeddings
        options:
          model: qwen3.7-text-embedding-flash
      # 关闭重试,避免超时被放大 3 倍
      retry:
        max-attempts: 1
    chroma:
      client:
        host: ${CHROMADB_HOST:127.0.0.1}
        port: ${CHROMADB_PORT:8000}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ww_finance?serverTimezone=GMT%2B8&characterEncoding=utf-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  # 跨域配置已迁移到 com.kzip.app.config.CorsConfig（Java 配置类）
  # 之前的 spring.mvc.cors.mappings 已删除，避免与 Java 配置重复/覆盖

# ChromaDB连接配置（本地环境）
chromadb:
  host: ${CHROMADB_HOST:127.0.0.1}
  port: ${CHROMADB_PORT:8000}
  auto-start: ${CHROMADB_AUTO_START:false}  # 是否自动启动ChromaDB（需要Python环境）

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.kzip.app.entity
  configuration:
    map-underscore-to-camel-case: true

# RAG 检索配置
rag:
  search:
    # 相似度阈值：similarity = 1 - distance（cosine）。
    # 实测（qwen3.7-text-embedding-flash + 本知识库）：
    #   相关查询 distance 0.51~0.61，无关查询 0.67~0.76，
    #   默认 0.35（distance 上限 0.65）可切分；设为 0 关闭过滤
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.35}