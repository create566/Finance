server:
  port: 8088 # 服务端口（修改：避免与Docker/WSL的80端口冲突）

spring:
  profiles:
    active: dev # 环境设置
  application:
    name: service-gateway # 服务名
  cloud:
    nacos:
      username: nacos
      password: shangqiuqwjk832
      discovery:
        server-addr: 127.0.0.1:8848 # nacos服务地址
        #ip: 192.168.65.29
    gateway:
      discovery:
        locator:
          enabled: true # gateway可以发现nacos中的微服务，并自动生成转发路由

      routes:
      - id: service-core
        uri: lb://service-core
        predicates:
        - Path=/*/core/**
      # 用户前台接口（登录/注册/绑卡/账户等都在 /api/user/** 下），此前没有任何路由会 404
      - id: service-user
        uri: lb://service-core
        predicates:
        - Path=/api/user/**
      - id: service-sms
        uri: lb://service-sms
        predicates:
        - Path=/*/sms/**
      - id: service-oss
        uri: lb://service-oss
        predicates:
        - Path=/*/oss/**
      # AI 服务未注册 Nacos，改为直连本机 8081；且 AI 控制器都在 /ai/** 下（不是 /api/ai/**）
      - id: service-ai
        uri: http://localhost:8081
        predicates:
        - Path=/ai/**