server:
  port: 8088 # 服务端口（修改：避免与Docker/WSL的80端口冲突）

spring:
  profiles:
    active: dev # 环境设置
  application:
    name: service-gateway # 服务名
  cloud:
    nacos:
      # ⚠ 不要写 username/password：本机 Nacos 2.2.3 已关鉴权
      # （nacos.core.auth.enabled=false），其登录接口恒失败（500 / 403 user not found），
      # 配了账号只会让客户端每 2 秒重试并刷 SecurityProxy ERROR 日志。
      # 注意 gateway 的 nacos 配置同时出现在 application.yml 与 bootstrap.yml 两处，
      # 改一处不够 —— 两份都要清掉。详见 api/application.yml 同处注释。
      discovery:
        server-addr: 127.0.0.1:8848 # nacos服务地址
        #ip: 192.168.65.29
    gateway:
      discovery:
        locator:
          enabled: true # gateway可以发现nacos中的微服务，并自动生成转发路由

      routes:
      - id: service-core
        uri: lb://service-core
        predicates:
        - Path=/*/core/**
      # 用户前台接口（登录/注册/绑卡/账户等都在 /api/user/** 下），此前没有任何路由会 404
      - id: service-user
        uri: lb://service-core
        predicates:
        - Path=/api/user/**
      - id: service-sms
        uri: lb://service-sms
        predicates:
        - Path=/*/sms/**
      # ⚠ 这条不要删（2026-10-08 新增）：api 的历史业务副产物文件访问前缀。
      # 合同签名图、知识库 PDF、以及改造前上传的证件照，落盘在 uploads/ 下并已入库
      # （investor_attach.image_url、contract_sign_record.sign_img_url 存的就是
      # /api/knowledge/files/...），前端是直接 <el-image :src="该 URL"> 渲染。
      # 前端一旦改走网关，没有这条路由这些旧文件会全部 404（前端直连 8990 时看不出来）。
      # 之所以仍由 service-core 提供：这些文件是 api 进程内落盘的（ContractServiceImpl /
      # KnowledgeDocServiceImpl），属 api 自己的业务副产物，不归 finance-oss。
      - id: service-core-legacy-files
        uri: lb://service-core
        predicates:
        - Path=/api/knowledge/files/**
      - id: service-oss
        uri: lb://service-oss
        predicates:
        - Path=/*/oss/**
      # AI 服务未注册 Nacos —— 它是 Spring Boot 3.4.8 + Spring AI，与父 pom 的 Boot 2.3.4 不是同一技术栈，
      # 引入 Spring Cloud Alibaba discovery 有依赖版本冲突风险，故保持直连。
      # 且 AI 控制器都在 /ai/** 下（不是 /api/ai/**）。
      # 2026-10-09：地址改为可配置项，换机器/换端口无需改代码重新打包（默认值不变）。
      # 若将来 AI 注册进 Nacos，把 uri 换成 lb://service-ai 即可。
      - id: service-ai
        uri: ${AI_SERVICE_URI:http://localhost:8081}
        predicates:
        - Path=/ai/**