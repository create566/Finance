spring:
  profiles:
    active: dev # 环境设置
  application:
    name: service-sms # 服务名
  cloud:
    nacos:
      # ⚠ 不要写 username/password：本机 Nacos 2.2.3 已关鉴权
      # （nacos.core.auth.enabled=false），其登录接口恒失败（500 / 403 user not found），
      # 配了账号只会让客户端每 2 秒重试并刷 ERROR 日志。详见 api/application.yml 同处注释。
      discovery:
        server-addr: localhost:8848 # nacos服务地址
        # 全量启用（2026-10-08）：注册进 Nacos，供 api 的 service-sms 客户端
        # 与网关的 lb://service-sms（/*/sms/**）发现。
        # 注意：Nacos 未启动时会因注册失败而启动报错，这属于此方案的预期代价。
        enabled: true
        register-enabled: true
        # 配置命名空间
        namespace: public
      config:
        import-check:
          enabled: false
        # 配置分组
        group: DEFAULT_GROUP
        server-addr: localhost:8848
        # 配置命名空间
        namespace: public
        file-extension: yaml
        enabled: false

logging:
  level:
    com:
      alibaba:
        nacos:
          client: error
