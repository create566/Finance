spring:
  profiles:
    active: dev # 环境设置
  application:
    name: service-sms # 服务名
  cloud:
    nacos:
      username: nacos
      password: shangqiuqwjk832
      discovery:
        server-addr: localhost:8848 # nacos服务地址
        # 本地开发：api 通过 ribbon 直连 localhost:8120（见 api/application.yml），无需注册 Nacos。
