spring:
  profiles:
    active: dev # 环境设置
  application:
    name: service-sms # 服务名
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848 # nacos服务地址
        enabled: true
        register-enabled: true
        # 配置命名空间
        namespace: public
      config:
        import-check:
          enabled: false
        # 配置分组
        group: DEFAULT_GROUP
        server-addr: localhost:8848
        # 配置命名空间
        namespace: public
        file-extension: yaml
        enabled: false

logging:
  level:
    com:
      alibaba:
        nacos:
          client: error
