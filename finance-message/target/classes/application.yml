server:
  port: 8120
  # 访问日志：按天滚动落到 logs/access/（同样是绝对路径，避免落到 Tomcat 临时 base dir）
  tomcat:
    accesslog:
      enabled: true
      directory: '${LOG_HOME:D:/桌面/实训/demo/logs}/access'
      prefix: msg-access.
      suffix: .log
      file-date-format: yyyy-MM-dd
      rotate: true
      buffered: false
      max-days: 30
      pattern: '%{yyyy-MM-dd HH:mm:ss.SSS}t %a "%r" %s %b %D'

spring:
  profiles:
    active: dev
  application:
    name: service-sms

  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 8
        min-idle: 0

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848