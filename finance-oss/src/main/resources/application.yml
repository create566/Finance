server:
  port: 8130 # 服务端口
  # 访问日志：按天滚动落到 logs/access/（同样是绝对路径，避免落到 Tomcat 临时 base dir）
  tomcat:
    accesslog:
      enabled: true
      directory: '${LOG_HOME:D:/桌面/实训/demo/logs}/access'
      prefix: oss-access.
      suffix: .log
      file-date-format: yyyy-MM-dd
      rotate: true
      buffered: false
      max-days: 30
      pattern: '%{yyyy-MM-dd HH:mm:ss.SSS}t %a "%r" %s %b %D'

# ---------------------------------------------------------------------------
# 服务名与注册中心在 bootstrap.yml（service-oss；Nacos 127.0.0.1:8848，discovery/config 均 enabled）
# 本文件只放服务自身的业务配置。
# ---------------------------------------------------------------------------
spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # 鉴权依赖：JwtAuthInterceptor 用 StringRedisTemplate 校验 login:token:<role>:<id>
  # 与 api 共用同一个 Redis（Docker ww_redis）。Redis 不通 ⇒ 所有文件接口 401。
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
    timeout: 3000ms

# 本地文件存储。与 api 模块共用同一个 uploads 目录、同一套目录结构
# （{base-path}/{category}/u<userId>/{fileName}），因此两边互相也能取到对方写的文件。
upload:
  base-path: ${UPLOAD_BASE_PATH:D:/桌面/实训/demo/uploads/}
  # 服务根前缀，**不含末尾斜杠**；与 UploadConfig 的 /api/oss/file/images/** 资源映射配套
  url-prefix: ${UPLOAD_URL_PREFIX:/api/oss/file}

# JWT 密钥。必须与 api 的 security.jwt.secret 完全一致，否则本模块无法校验
# api 签发、存在同一 Redis 里的 token，所有接口都会 401。
security:
  jwt:
    secret: ${JWT_SECRET:vsofo-5grcs-secret}
