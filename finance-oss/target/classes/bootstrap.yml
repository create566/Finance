spring:
  profiles:
    active: dev # 环境设置
  application:
    name: service-oss # 服务名

  cloud:
    nacos:
      # ⚠ 不要写 username/password：本机 Nacos 2.2.3 已关鉴权
      # （nacos.core.auth.enabled=false），其登录接口恒失败（500 / 403 user not found），
      # 配了账号只会让客户端每 2 秒重试并刷 ERROR 日志 —— finance-oss 实测日志里
      # 满屏 "SecurityProxy login http request failed" 就是这么来的。
      # 详见 api/application.yml 同处注释。
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
        namespace: public
        # 如需单独覆盖鉴权，可在 discovery 下再写 username/password
      config:
        enabled: true
        import-check:
          enabled: false
        group: DEFAULT_GROUP
        server-addr: 127.0.0.1:8848
        namespace: public
        file-extension: yaml
        # dataId = ${prefix}-${spring.profiles.active}.${file-extension}
        # prefix 默认取 spring.application.name，即 service-oss-dev.yaml
        prefix: ${spring.application.name}

logging:
  level:
    com:
      alibaba:
        nacos:
          client: info # 本地调试阶段开 info：gRPC 端口不通/鉴权失败/注册重试等细节会打出来，否则 error 级别会吞掉这些报错
